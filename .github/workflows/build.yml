# Builds the core blob and runs the host test on every push and pull request, and keeps the
# packaged result as a workflow artifact. A tag named v* also publishes a GitHub release with the
# SD card zip and the source archive.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blob:
    # 22.04's gcc-arm-none-eabi is 10.3-2021.07, the toolchain the blob is developed and tested with
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi \
            gcc zlib1g-dev zip
          arm-none-eabi-gcc --version | head -1

      - name: Build the blob
        run: ./build.sh

      - name: Host test (built in Mega Drive image)
        run: |
          tests/build_host_test.sh
          out/gpgx_host_test

      - name: Package
        id: pkg
        run: |
          tools/package.sh | tee pkg.txt
          echo "zip=$(sed -n 1p pkg.txt)" >> "$GITHUB_OUTPUT"
          echo "src=$(sed -n 2p pkg.txt)" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$(sed -n 1p pkg.txt)" .zip)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.src }}
            out/genesis-plus-gx-pico.blob
            out/genesis-plus-gx-pico.map

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.src }}
            out/genesis-plus-gx-pico.blob
